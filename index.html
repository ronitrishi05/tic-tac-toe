<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="game-wrap">

    <header class="header">
      <h1 class="title">Tic <span>Tac</span> Toe</h1>
      <p class="status" id="status">Your Turn</p>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-item">
        <span class="score-label">You</span>
        <span class="score-value" id="scorePlayer">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">Draws</span>
        <span class="score-value" id="scoreDraw">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">CPU</span>
        <span class="score-value" id="scoreComputer">0</span>
      </div>
    </section>

    <section class="board" id="board">
      <!-- 9 cells generated by JS -->
    </section>

    <button class="restart-btn" id="restartBtn">Restart</button>

  </main>

  <!-- Result Popup Overlay -->
  <div class="overlay" id="overlay">
    <div class="popup" id="popup">
      <div class="popup-image-wrap" id="popupImageWrap">
        <img id="popupImage" class="popup-image" src="" alt="" />
      </div>
      <h2 class="popup-text" id="popupText"></h2>
      <button class="play-again-btn" id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
